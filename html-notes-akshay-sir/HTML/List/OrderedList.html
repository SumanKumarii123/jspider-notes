<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ol>
        <li>Mango</li>
        <li>Papaya</li>
        <li>Grapes</li>
    </ol>
    <!--Only reverse will be sequence, not content like Mango-->
     <ol start="1" reversed>
        <li>Mango</li>
        <li>Papaya</li>
        <li>Grapes</li>
    </ol>
     <ol type="A" reversed>
        <li>Mango</li>
        <li>Papaya</li>
        <li>Grapes</li>
    </ol>
    <!---Start attribute will only accept numeric value-->
     <ol type="a" start="6">
        <li>Mango</li>
        <li>Papaya</li>
        <li>Grapes</li>
    </ol>
     <ol type="i" start="5" reversed>
        <li>Mango</li>
        <li>Papaya</li>
        <li>Grapes</li>
    </ol>
     <ol type="I">
        <li>Mango</li>
        <li>Papaya</li>
        <li>Grapes</li>
    </ol>
</body>
</html>
