<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style> 
     /* Specificity (id-1,class-4,tag-0) ---- First Priority because id=1 */
        #one.demo.demo1.demo2.demo3{
            background-color: cyan;
        }
         /* Specificity (id-0,class-4,tag-0) */
        .demo.demo1.demo2.demo3{
            background-color: burlywood;
        }
        /* Specificity (id-1,class-1,tag-0) */
        .demo#one{
            background-color: crimson;
        }
        #one{
            background-color: brown;
        }
        .demo{
            background-color: blueviolet;
        }
          /*When i will not provide height then it will not give output on the screen */
        div{
            background-color: rgb(red, green, blue);
            height: 200px;
        }
        div{
            background-color: aqua;
        }
    </style>
</head>
<body>
   <div class="demo demo1 demo2 demo3" id="one"></div>
</body>
</html>
