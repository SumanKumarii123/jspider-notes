<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 300px;
            width: 400px;
            background-image: linear-gradient(yellow,red,blue);
            border: 2px solid black;
        }
        .flag{
            height: 300px;
            width: 400px;
            border: solid;
            background-image: linear-gradient(orange 0px,orange 100px,white 100px,white 200px,green 200px,green 300px);
        }
        .box2{
            height: 300px;
            width: 300px;
            border: 1px solid black;
            background-image: radial-gradient(ellipse,red,yellow,blue);
            border-radius: 50%; 
            background-image: conic-gradient(red 0deg,red 90deg,green 90deg,green 180deg,yellow 180deg,yellow 270deg,blue 270deg,blue 360deg);
        }
        .box3{
            height: 300px;
            width: 300px;
            border: 2px solid black;
           /* background-image: radial-gradient(ellipse,red,yellow,blue); */
            border-radius: 50%; 
            background-image: conic-gradient(red 0deg,red 120deg,green 120deg,green 240deg,yellow 240deg,yellow 360deg);
        }
    </style>
</head>
<body>
    <section class="box"></section>
    <br>
    <div class="flag"></div>
    <div class="box2"></div>
    <div class="box3"></div>
</body>
</html>
