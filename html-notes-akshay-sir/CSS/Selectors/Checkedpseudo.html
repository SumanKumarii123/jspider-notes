<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .on:checked{
            height: 100px;
            width: 100px;
        }
         .check:checked{
            height: 100px;
            width: 100px;
        }
        .check:checked+div{
            height: 100px;
            width: 100px;
            background-color: red;
        }
    </style>
</head>
<body>
    ON<input type="radio" name="" id="" class="on">
    <input type="checkbox" class="check">
    <section>
    <input type="checkbox" class="check">
    <div></div>
    </section>
    
</body>
</html>
