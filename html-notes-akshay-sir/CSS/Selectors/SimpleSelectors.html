<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Types of Selectors----
        1. simple selectors
        a. tagname selector(tag)
        b. id selector(#)
        c. class selector(.)
        d. universal selector(*)
        e. grouping (,)
        */
    /* h1{
            background-color: blue;
       } */
        #li4{
            background-color: aqua;
        }
        .odd{
            background-color: green;
        }
        *{
            background-color: yellow;
        }
        p,div{
            background-color: aquamarine;
        }
    </style>
</head>
<body>
    <h1>Heading Tag</h1>
    <p>para-1</p>
    <p>para-2</p>
    <p>para-3</p>
    <p>para-4</p>
    <p>para-5</p>
    <div>div-1</div>
    <div>div-2</div>
    <div>div-3</div>
    <div>div-4</div>
    <div>div-5</div>
    <ul>
        <li class="odd">list-1</li>
        <li>list-2</li>
        <li class="odd">list-3</li>
        <li id="li4">list-4</li>
        <li class="odd">list-5</li>
        <li>list-6</li>
    </ul>
</body>
</html>
