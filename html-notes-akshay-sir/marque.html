<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>marquee tag</title>
</head>
<body>
    <marquee behavior="scroll" scrollamount="30" loop="2" direction="">
        <h1>Hello</h1>
    </marquee>
    <marquee behavior="slide" scrollamount="30" loop="2" direction="">
        <h1>Hello</h1>
    </marquee>
    <marquee behavior="alternate" scrollamount="30" direction="">
        <h1>Hello</h1>
    </marquee>
    <marquee style="background-color: yellow;"behavior="" direction="right">
        <h1>The sale is live:</h1>
    </marquee>
    <marquee behavior=""  direction="">
        <img src="https://media.istockphoto.com/id/1385217969/photo/ginger-cat-walks.jpg?s=612x612&w=0&k=20&c=mBhFzDA2dp23dV4jq6FooaSzG2tmCZMKP6TV56hMVII=" height="" alt="">
    </marquee>
    <marquee behavior=""  direction="right" scrollamount="50">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSYYcKQfLsT1lVgBeLtrexuh8uY_w7Ig_5mHA&s" height="" alt="">
    </marquee>
    <marquee behavior=""  direction="down" scrollamount="50">
        <img src="https://www.shutterstock.com/image-photo/grevys-zebra-walking-on-grass-260nw-2305712171.jpg" height="" alt="">
    </marquee>
</body>
</html>
